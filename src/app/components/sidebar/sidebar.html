<div
  class="offcanvas offcanvas-start text-bg-dark sidebar"
  tabindex="-1"
  id="offcanvasSidebar"
  aria-labelledby="offcanvasSidebarLabel"
>
  <div
    class="offcanvas-header"
    style="
      background: radial-gradient(circle at top right, #1ca64f 0%, #006370 100%);
      border-radius: 10px;
    "
  >
    @if (userName()) {
      <div>
        <div style="font-weight: 600; font-size: 0.9rem">{{ userName() }}</div>
        <div style="font-size: 0.8rem; opacity: 0.65">{{ userEmail() }}</div>
      </div>
    }
  </div>

  <div class="offcanvas-body">
    <ul class="nav navbar-nav justify-content-end flex-grow-1">
      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/home"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        >
          <i class="bi bi-house"></i> Principal
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/category/list"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        >
          <i class="bi bi-tags"></i> Categorias
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link logout-link" (click)="onLogout()">
          <i class="bi bi-box-arrow-left"></i> Sair
        </a>
      </li>
    </ul>

    <div class="nav-item version-label">
      <span>Versão 1.0</span>
    </div>
  </div>
</div>

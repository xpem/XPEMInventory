<div
  class="offcanvas offcanvas-start sidebar-light"
  tabindex="-1"
  id="offcanvasSidebar"
  aria-labelledby="offcanvasSidebarLabel"
>
  <!-- Brand -->
  <div class="sidebar-brand">
    <img src="logo.png" alt="Logo" class="brand-logo" />
    <span class="sidebar-brand-name" id="offcanvasSidebarLabel">Xpem</span>
    <button
      type="button"
      class="sidebar-close"
      data-bs-dismiss="offcanvas"
      aria-label="Fechar"
    >
      <i class="bi bi-x"></i>
    </button>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">
    <a
      class="sidebar-nav-link"
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      data-bs-dismiss="offcanvas"
    >
      <i class="bi bi-house"></i>
      <span>Home</span>
    </a>
    <a
      class="sidebar-nav-link"
      routerLink="/category/list"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      data-bs-dismiss="offcanvas"
    >
      <i class="bi bi-tags"></i>
      <span>Categorias</span>
    </a>
  </nav>

  <!-- Footer: usuário + sair + versão -->
  <div class="sidebar-footer">
    @if (userName()) {
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">{{ userInitials() }}</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">{{ userName() }}</div>
          <div class="sidebar-user-email">{{ userEmail() }}</div>
        </div>
      </div>
    }

    <button class="sidebar-logout" (click)="onLogout()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Sair</span>
    </button>

    <div class="sidebar-version">Versão 1.0</div>
  </div>
</div>

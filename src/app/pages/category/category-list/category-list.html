<!-- Header -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0" style="color: var(--primary-green)">Categorias</h5>
  <button type="button" class="btn btn-success btn-sm" (click)="goToNew()">
    <i class="bi bi-plus-lg"></i>&nbsp;&nbsp;Nova Categoria
  </button>
</div>

<!-- Loading -->
@if (isLoading()) {
  <div class="d-flex justify-content-center my-5">
    <div class="spinner-border" style="color: var(--primary-green)" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>
}

<!-- Lista -->
@if (!isLoading() && categories().length === 0) {
  <div class="text-center my-5" style="color: var(--text-muted)">
    <i class="bi bi-tags" style="font-size: 3rem"></i>
    <p class="mt-2">Nenhuma categoria encontrada.</p>
  </div>
}

@if (!isLoading() && categories().length > 0) {
  <div class="list-group">
    @for (cat of categories(); track cat.id) {
      <button
        type="button"
        class="list-group-item list-group-item-action d-flex align-items-center gap-3"
        (click)="goToEdit(cat.id)"
        style="background-color: var(--bg-card); color: var(--text-light); border-color: var(--border-color)"
      >
        <!-- Círculo de cor -->
        <div
          class="category-circle-md flex-shrink-0"
          [style.background]="cat.color ?? '#29a0b1'"
          aria-hidden="true"
        ></div>

        <!-- Nome e contagem de subcategorias -->
        <div class="flex-grow-1 text-start">
          <span class="fw-semibold">{{ cat.name }}</span>
          @if (cat.subCategories && cat.subCategories.length > 0) {
            <span class="ms-2 badge text-bg-secondary" style="font-size: 0.7rem">
              {{ cat.subCategories.length }} sub
            </span>
          }
        </div>

        <i class="bi bi-chevron-right" style="color: var(--text-muted)"></i>
      </button>
    }
  </div>
}

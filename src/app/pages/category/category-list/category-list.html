<!-- Cabeçalho -->
<div class="cat-header">
  <h1 class="cat-title">Categorias</h1>
  <button type="button" class="btn-add-cat" (click)="goToNew()">
    <i class="bi bi-plus-lg"></i> Nova categoria
  </button>
</div>

<!-- Loading -->
@if (isLoading()) {
  <div class="loading-center">
    <div class="spinner-border spinner-coral" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>
}

<!-- Empty state -->
@if (!isLoading() && categories().length === 0) {
  <div class="empty-state">
    <i class="bi bi-tags"></i>
    <p>Nenhuma categoria encontrada.</p>
  </div>
}

<!-- Lista -->
@if (!isLoading() && categories().length > 0) {
  <div class="cat-list">
    @for (cat of categories(); track cat.id) {
      <button
        type="button"
        class="cat-item"
        (click)="goToEdit(cat.id)"
      >
        <div
          class="cat-color-dot"
          [style.background-color]="cat.color ?? '#c4714a'"
          aria-hidden="true"
        ></div>

        <span class="cat-name">{{ cat.name }}</span>

        @if (cat.subCategories && cat.subCategories.length > 0) {
          <span class="cat-sub-badge">{{ cat.subCategories.length }} sub</span>
        }

        <i class="bi bi-chevron-right cat-chevron"></i>
      </button>
    }
  </div>
}

<div
  class="modal fade"
  id="modalCategories"
  tabindex="-1"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  aria-labelledby="modalCategoriesLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content" style="background-color: #faf6f1; border: 1px solid #ecdfd3">
      <div class="modal-header" style="background-color: #c4714a; border-bottom: none">
        <h5 class="modal-title text-white" id="modalCategoriesLabel">Categorias</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>

      <div class="modal-body" style="padding: 0.75rem">
        <div style="display: flex; flex-direction: column; gap: 0.375rem">
          @for (cat of categories; track cat.id) {
            @if (cat.subCategories && cat.subCategories.length > 0) {
              <a
                class="modal-cat-item"
                href="#"
                data-bs-toggle="modal"
                data-bs-target="#modalSubCategories"
                (click)="onShowSub(cat.id)"
              >
                <div class="modal-cat-dot" [style.background-color]="cat.color ?? '#c4714a'"></div>
                <span class="modal-cat-name">{{ cat.name }}</span>
                <i class="bi bi-chevron-right modal-cat-arrow"></i>
              </a>
            } @else {
              <a
                class="modal-cat-item"
                href="#"
                data-bs-dismiss="modal"
                (click)="onSelect(cat.id)"
              >
                <div class="modal-cat-dot" [style.background-color]="cat.color ?? '#c4714a'"></div>
                <span class="modal-cat-name">{{ cat.name }}</span>
              </a>
            }
          }
        </div>
      </div>

      <div class="modal-footer" style="border-top-color: #ecdfd3">
        <button type="button" class="modal-btn-back" data-bs-dismiss="modal">
          <i class="bi bi-arrow-left-short"></i> Voltar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .modal-cat-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.875rem;
    background-color: white;
    border: 1px solid #ecdfd3;
    border-radius: 10px;
    text-decoration: none;
    color: #1a1a1a;
    transition: background-color 0.15s;
  }
  .modal-cat-item:hover {
    background-color: #f0e9df;
    color: #1a1a1a;
  }
  .modal-cat-dot {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .modal-cat-name {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .modal-cat-arrow {
    color: #9ca3af;
    font-size: 0.875rem;
  }
  .modal-btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: none;
    border: 1px solid #ddd6cc;
    border-radius: 8px;
    padding: 0.4rem 0.875rem;
    font-size: 0.875rem;
    color: #4b5563;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .modal-btn-back:hover {
    background-color: #f0e9df;
  }
</style>

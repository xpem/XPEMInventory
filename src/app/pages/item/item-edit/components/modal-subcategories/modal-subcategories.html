<div
  class="modal fade"
  id="modalSubCategories"
  tabindex="-1"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  aria-labelledby="modalSubCategoriesLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content" style="background-color: #faf6f1; border: 1px solid #ecdfd3">
      <div class="modal-header" style="background-color: #c4714a; border-bottom: none">
        <h5 class="modal-title text-white" id="modalSubCategoriesLabel">
          {{ selectedCategory?.name ?? 'Subcategorias' }}
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>

      <div class="modal-body" style="padding: 0.75rem">
        @if (selectedCategory) {
          <div style="display: flex; flex-direction: column; gap: 0.375rem">
            <!-- Opção sem subcategoria -->
            <a
              class="modal-cat-item"
              href="#"
              data-bs-dismiss="modal"
              (click)="onSelect(null)"
            >
              <div class="modal-cat-dot" [style.background-color]="selectedCategory.color ?? '#c4714a'"></div>
              <span class="modal-cat-name">[ {{ selectedCategory.name }} ]</span>
            </a>

            @for (sub of selectedCategory.subCategories ?? []; track sub.id) {
              <a
                class="modal-cat-item"
                href="#"
                data-bs-dismiss="modal"
                (click)="onSelect(sub.id)"
              >
                <div
                  class="modal-sub-icon"
                  [style.background-color]="selectedCategory.color ?? '#c4714a'"
                >
                  <i class="bi bi-{{ sub.iconName ?? 'tag' }}"></i>
                </div>
                <span class="modal-cat-name">{{ sub.name }}</span>
              </a>
            }
          </div>
        }
      </div>

      <div class="modal-footer" style="border-top-color: #ecdfd3">
        <button
          type="button"
          class="modal-btn-back"
          data-bs-target="#modalCategories"
          data-bs-toggle="modal"
        >
          <i class="bi bi-arrow-left-short"></i> Voltar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .modal-cat-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0.875rem;
    background-color: white;
    border: 1px solid #ecdfd3;
    border-radius: 10px;
    text-decoration: none;
    color: #1a1a1a;
    transition: background-color 0.15s;
  }
  .modal-cat-item:hover {
    background-color: #f0e9df;
    color: #1a1a1a;
  }
  .modal-cat-dot {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .modal-sub-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: white;
    flex-shrink: 0;
  }
  .modal-cat-name {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .modal-btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: none;
    border: 1px solid #ddd6cc;
    border-radius: 8px;
    padding: 0.4rem 0.875rem;
    font-size: 0.875rem;
    color: #4b5563;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .modal-btn-back:hover {
    background-color: #f0e9df;
  }
</style>

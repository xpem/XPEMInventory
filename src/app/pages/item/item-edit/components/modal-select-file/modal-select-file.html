<div
  class="modal fade"
  id="modalSelectFile"
  tabindex="-1"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  aria-labelledby="modalSelectFileLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content" style="background-color: #faf6f1; border: 1px solid #ecdfd3">
      <div class="modal-header" style="background-color: #c4714a; border-bottom: none">
        <h5 class="modal-title text-white" id="modalSelectFileLabel">Selecionar imagem</h5>
      </div>

      <div class="modal-body">
        @if (!tempImageDataUrl()) {
          <div>
            <input
              type="file"
              id="fileInput"
              class="modal-file-input"
              accept="image/*"
              (change)="onFileChange($event)"
              aria-label="Selecionar arquivo de imagem"
            />
          </div>
        }

        @if (tempImageDataUrl()) {
          <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem">
            <img
              [src]="tempImageDataUrl()"
              style="max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid #ecdfd3"
              alt="Pré-visualização"
            />
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center">
              <button type="button" class="modal-btn-danger" (click)="clearFile()">
                <i class="bi bi-trash"></i> Limpar
              </button>
              <button
                type="button"
                class="modal-btn-save"
                data-bs-dismiss="modal"
                (click)="saveFile()"
              >
                <i class="bi bi-check-lg"></i> Usar imagem
              </button>
            </div>
          </div>
        }
      </div>

      <div class="modal-footer" style="border-top-color: #ecdfd3">
        <button type="button" class="modal-btn-back" data-bs-dismiss="modal" (click)="clearFile()">
          <i class="bi bi-arrow-left-short"></i> Voltar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .modal-file-input {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: 1px solid #ddd6cc;
    border-radius: 8px;
    font-size: 0.9rem;
    background-color: white;
    color: #1a1a1a;
    box-sizing: border-box;
  }
  .modal-btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: none;
    border: 1px solid #ddd6cc;
    border-radius: 8px;
    padding: 0.4rem 0.875rem;
    font-size: 0.875rem;
    color: #4b5563;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .modal-btn-back:hover { background-color: #f0e9df; }
  .modal-btn-danger {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 1rem;
    background: none;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    font-size: 0.875rem;
    color: #ef4444;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .modal-btn-danger:hover { background-color: rgba(239,68,68,0.08); }
  .modal-btn-save {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 1rem;
    background-color: #c4714a;
    border: none;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    color: white;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .modal-btn-save:hover { background-color: #a85e3a; }
</style>

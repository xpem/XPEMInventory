<div
  class="modal fade"
  id="modalCamera"
  tabindex="-1"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  aria-labelledby="modalCameraLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content background-custom">
      <div class="modal-header" style="background: radial-gradient(circle at top right, #1ca64f 0%, #006370 100%)">
        <h5 class="modal-title text-white" id="modalCameraLabel">Capturar Foto</h5>
      </div>

      <div class="modal-body">
        @if (errorMessage()) {
          <div class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-circle"></i> {{ errorMessage() }}
          </div>
        }

        @if (!tempImageDataUrl()) {
          <div class="d-flex flex-column align-items-center gap-3">
            <video
              id="cameraVideoFeed"
              autoplay
              playsinline
              class="img-fluid"
              style="max-width: 400px; border: 1px solid var(--border-color); background: #000"
              aria-label="Feed da câmera"
            ></video>

            <button
              type="button"
              class="btn btn-success w-100"
              style="max-width: 400px"
              [disabled]="!isCameraActive()"
              (click)="takePhoto()"
            >
              <i class="bi bi-camera"></i> Capturar Foto
            </button>
          </div>
        }

        @if (tempImageDataUrl()) {
          <div class="d-flex justify-content-center mb-3">
            <img
              [src]="tempImageDataUrl()"
              class="img-fluid"
              style="max-width: 400px; height: auto; border: 1px solid var(--border-color)"
              alt="Foto capturada"
            />
          </div>
          <div class="d-flex justify-content-center flex-wrap gap-2">
            <button type="button" class="btn btn-outline-danger" (click)="clearPhoto()">
              <i class="bi bi-trash"></i> Descartar
            </button>
            <button
              type="button"
              class="btn btn-success"
              data-bs-dismiss="modal"
              (click)="savePhoto()"
            >
              <i class="bi bi-check-lg"></i> Usar Foto
            </button>
          </div>
        }

        <canvas id="cameraCanvas" style="display: none" aria-hidden="true"></canvas>
      </div>

      <div class="modal-footer" style="border-top-color: var(--border-color)">
        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal"
          (click)="stopCamera()"
        >
          <i class="bi bi-arrow-left-short"></i> Voltar
        </button>
      </div>
    </div>
  </div>
</div>

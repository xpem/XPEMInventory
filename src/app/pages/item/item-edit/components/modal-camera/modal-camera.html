<div
  class="modal fade"
  id="modalCamera"
  tabindex="-1"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  aria-labelledby="modalCameraLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content" style="background-color: #faf6f1; border: 1px solid #ecdfd3">
      <div class="modal-header" style="background-color: #c4714a; border-bottom: none">
        <h5 class="modal-title text-white" id="modalCameraLabel">Capturar foto</h5>
      </div>

      <div class="modal-body">
        @if (errorMessage()) {
          <div style="background: rgba(239,68,68,0.08); border: 1px solid #fca5a5; border-radius: 8px; padding: 0.625rem 0.875rem; color: #ef4444; font-size: 0.875rem; margin-bottom: 1rem">
            <i class="bi bi-exclamation-circle"></i> {{ errorMessage() }}
          </div>
        }

        @if (!tempImageDataUrl()) {
          <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem">
            <video
              id="cameraVideoFeed"
              autoplay
              playsinline
              style="max-width: 100%; border-radius: 8px; border: 1px solid #ecdfd3; background: #000"
              aria-label="Feed da câmera"
            ></video>
            <button
              type="button"
              class="modal-btn-save"
              style="width: 100%; max-width: 320px; justify-content: center"
              [disabled]="!isCameraActive()"
              (click)="takePhoto()"
            >
              <i class="bi bi-camera"></i> Capturar foto
            </button>
          </div>
        }

        @if (tempImageDataUrl()) {
          <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem">
            <img
              [src]="tempImageDataUrl()"
              style="max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid #ecdfd3"
              alt="Foto capturada"
            />
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center">
              <button type="button" class="modal-btn-danger" (click)="clearPhoto()">
                <i class="bi bi-trash"></i> Descartar
              </button>
              <button
                type="button"
                class="modal-btn-save"
                data-bs-dismiss="modal"
                (click)="savePhoto()"
              >
                <i class="bi bi-check-lg"></i> Usar foto
              </button>
            </div>
          </div>
        }

        <canvas id="cameraCanvas" style="display: none" aria-hidden="true"></canvas>
      </div>

      <div class="modal-footer" style="border-top-color: #ecdfd3">
        <button type="button" class="modal-btn-back" data-bs-dismiss="modal" (click)="stopCamera()">
          <i class="bi bi-arrow-left-short"></i> Voltar
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .modal-btn-back {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    background: none;
    border: 1px solid #ddd6cc;
    border-radius: 8px;
    padding: 0.4rem 0.875rem;
    font-size: 0.875rem;
    color: #4b5563;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .modal-btn-back:hover { background-color: #f0e9df; }
  .modal-btn-danger {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 1rem;
    background: none;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    font-size: 0.875rem;
    color: #ef4444;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .modal-btn-danger:hover { background-color: rgba(239,68,68,0.08); }
  .modal-btn-save {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.5rem 1rem;
    background-color: #c4714a;
    border: none;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    color: white;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .modal-btn-save:hover:not(:disabled) { background-color: #a85e3a; }
  .modal-btn-save:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
